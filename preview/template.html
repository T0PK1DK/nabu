<title>Nabu</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Cuneiform&display=swap">
<style>
  /* Layout: a dark library. Home is a seal, a field, and your shelf of summoned books.
     A search summons one book: it flies in, opens, and writes the page for you while doorways and related books wait beside it. */
  :root {
    color-scheme: dark;
    --room: #0f0d0b;
    --page: #17120e;
    --page-2: #1d1712;
    --ink: #f3e6d4;
    --muted: #b09a80;
    --faint: #75634f;
    --line: rgba(243, 230, 212, .1);
    --bronze: #c9854a;
    --bronze-2: #e2b07a;
    --on-bronze: #1a120c;
    --link: #ebc493;
    --good: #c5d2b2;
    --draft: #e0c078;
    --lapis: #16202e;
    --lapis-2: #1d2939;
    --glow: rgba(226, 176, 122, .5);
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --serif: "EB Garamond", "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --cun: "Noto Sans Cuneiform", serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--room); color: var(--ink); }
  body { font-family: var(--serif); font-size: 18px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--bronze-2); outline-offset: 3px; }

  /* Ambient library */
  .library { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: opacity .8s ease; }
  body.reading .library { opacity: .45; }
  .tome-bg {
    position: absolute; left: var(--x); top: var(--y); width: var(--w); color: var(--c); opacity: var(--o);
    transform: rotate(var(--r)); animation: drift var(--d) ease-in-out var(--delay) infinite alternate;
    filter: drop-shadow(0 0 10px rgba(201, 133, 74, .25));
  }
  .tome-bg svg { display: block; width: 100%; height: auto; }
  .tome-bg.open .leaf { transform-origin: 50% 100%; animation: leaf calc(var(--d) / 2.2) ease-in-out var(--delay) infinite alternate; }
  .mote {
    position: absolute; left: var(--x); bottom: -10px; width: 3px; height: 3px; border-radius: 50%;
    background: var(--bronze-2); box-shadow: 0 0 8px 2px var(--glow); opacity: 0;
    animation: rise var(--d) linear var(--delay) infinite;
  }
  .library.stir .tome-bg { animation-duration: calc(var(--d) / 3); filter: drop-shadow(0 0 16px var(--glow)); }
  .library.stir .mote { animation-duration: calc(var(--d) / 2.5); }
  @keyframes drift { from { transform: translate3d(0,0,0) rotate(var(--r)); } to { transform: translate3d(var(--dx), -26px, 0) rotate(calc(var(--r) + 7deg)); } }
  @keyframes leaf { to { transform: scaleY(.82) skewX(-6deg); } }
  @keyframes rise { 10% { opacity: .9; } 80% { opacity: .5; } to { opacity: 0; transform: translate3d(var(--dx), -100vh, 0); } }
  @keyframes bob { from { transform: translateY(0) rotate(var(--r, 0deg)); } to { transform: translateY(-7px) rotate(calc(var(--r, 0deg) + 1.5deg)); } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .app { position: relative; z-index: 1; min-height: 100vh; padding-inline: 16px; }

  .field {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: rgba(20, 16, 13, .9); border-radius: 999px; padding: 6px 6px 6px 22px;
    box-shadow: 0 0 0 1px rgba(201, 133, 74, .45), 0 10px 30px rgba(0, 0, 0, .45);
    transition: box-shadow .2s ease;
  }
  .field:focus-within { box-shadow: 0 0 0 1px var(--bronze-2), 0 0 28px rgba(201, 133, 74, .32), 0 10px 30px rgba(0, 0, 0, .45); }
  .field input {
    flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink);
    font: 21px/1.2 var(--serif); padding: 8px 0; outline: none; -webkit-appearance: none;
  }
  .field input::placeholder { color: rgba(176, 154, 128, .6); }
  .field input::-webkit-search-cancel-button { display: none; }
  .go { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--bronze); color: var(--on-bronze); cursor: pointer; }
  .go:hover { background: var(--bronze-2); }

  /* Home */
  .home { min-height: 100vh; display: grid; align-content: center; justify-items: center; padding-block: 56px 40px; }
  .home-inner { width: min(660px, 100%); display: grid; justify-items: center; gap: 20px; text-align: center; }
  .seal-img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; object-position: center 14%; box-shadow: 0 0 0 1px rgba(201,133,74,.6), 0 0 44px rgba(201,133,74,.28); }
  .wordmark { margin: 0; font: 600 clamp(56px, 14vw, 96px)/1 var(--display); letter-spacing: .14em; padding-left: .14em; text-shadow: 0 0 34px rgba(201, 133, 74, .28); }
  .tagline { margin: -4px 0 4px; color: var(--muted); font-size: 20px; font-style: italic; text-wrap: balance; }
  .home form { width: 100%; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip { background: rgba(20,16,13,.6); border: 1px solid rgba(201,133,74,.3); border-radius: 999px; padding: 5px 14px; color: var(--muted); font-size: 16px; cursor: pointer; }
  .chip:hover { color: var(--bronze-2); border-color: var(--bronze-2); }

  .shelf { width: min(980px, 100%); margin-top: 46px; }
  .shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .shelf-head h2 { margin: 0; font: 500 13px var(--serif); letter-spacing: .22em; text-transform: uppercase; color: var(--bronze-2); }
  .shelf-head span { color: var(--faint); font-size: 15px; font-style: italic; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
  .book-btn {
    position: relative; display: grid; align-content: space-between; gap: 10px; min-height: 172px; padding: 14px 14px 12px 20px;
    border: 0; border-radius: 3px 6px 6px 3px; cursor: pointer; text-align: left;
    background: linear-gradient(90deg, rgba(0,0,0,.35) 0 7px, transparent 7px), linear-gradient(160deg, var(--hue, #5a3b25), #24180f 85%);
    box-shadow: inset -3px 0 0 rgba(243,230,212,.18), 0 0 0 1px rgba(201,133,74,.28), 0 14px 26px rgba(0,0,0,.45);
    animation: bob var(--d, 5s) ease-in-out var(--delay, 0s) infinite alternate;
    transition: box-shadow .25s ease, filter .25s ease;
  }
  .book-btn:hover { filter: brightness(1.15); box-shadow: inset -3px 0 0 rgba(243,230,212,.25), 0 0 0 1px var(--bronze-2), 0 0 30px rgba(201,133,74,.35), 0 14px 26px rgba(0,0,0,.45); }
  .book-btn .sig { font: 22px/1 var(--cun); color: var(--bronze-2); opacity: .85; }
  .book-btn strong { font: 600 16px/1.2 var(--display); letter-spacing: .03em; color: var(--ink); overflow-wrap: anywhere; }
  .book-btn small { color: rgba(243,230,212,.6); font-size: 13px; font-style: italic; }
  .book-btn .mark { position: absolute; top: 10px; right: 10px; font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--good); }

  /* Results */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; margin-inline: -16px; padding: 12px 16px;
    background: linear-gradient(180deg, rgba(15,13,11,.97) 75%, rgba(15,13,11,.86));
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
  }
  .top-row { display: flex; align-items: center; gap: 18px; max-width: 1180px; margin: 0 auto; }
  .mini { background: none; border: 0; padding: 0; cursor: pointer; font: 600 26px/1 var(--display); letter-spacing: .12em; flex: none; }
  .mini:hover { color: var(--bronze-2); }
  .top form { flex: 1; min-width: 0; max-width: 700px; }
  .top .field { padding: 3px 4px 3px 18px; }
  .top .field input { font-size: 18px; padding: 6px 0; }
  .top .go { width: 38px; height: 38px; }

  .board {
    max-width: 1180px; margin: 0 auto; padding-block: 22px 140px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px;
  }
  @media (min-width: 1000px) {
    .board { grid-template-columns: minmax(0, 1fr) 320px; column-gap: 34px; align-items: start; }
    .side { position: sticky; top: 92px; }
  }

  /* The summoned book */
  .summon { position: relative; perspective: 1600px; min-width: 0; }
  .summon.fly { animation: fly .75s cubic-bezier(.2,.9,.25,1.05) both; }
  @keyframes fly {
    0% { opacity: 0; transform: translate3d(38vw, -30vh, 0) rotate(-24deg) scale(.18); filter: blur(3px); }
    70% { opacity: 1; filter: none; }
    100% { opacity: 1; transform: none; }
  }
  .cover {
    position: absolute; inset: 0; z-index: 2; transform-origin: left center; border-radius: 4px 8px 8px 4px;
    background: radial-gradient(circle at 50% 38%, rgba(226,176,122,.25), transparent 40%), linear-gradient(160deg, #6b4428, #2a1b10 80%);
    box-shadow: inset 10px 0 0 rgba(0,0,0,.35), 0 0 0 1px rgba(226,176,122,.4);
    display: grid; place-items: center; backface-visibility: hidden; pointer-events: none;
  }
  .cover span { font: 64px/1 var(--cun); color: var(--bronze-2); text-shadow: 0 0 24px var(--glow); }
  .summon.fly .cover { animation: open-cover .9s cubic-bezier(.5,0,.2,1) .55s both; }
  @keyframes open-cover { 0% { transform: rotateY(0); } 99% { opacity: 1; } 100% { transform: rotateY(-178deg); opacity: 0; } }
  .summon:not(.fly) .cover { display: none; }

  .page {
    position: relative; min-height: 420px; padding: 30px 36px 34px; border-radius: 4px 8px 8px 4px;
    background: radial-gradient(700px 320px at 0% -80px, rgba(201,133,74,.14), transparent 60%), linear-gradient(180deg, var(--page-2), var(--page));
    box-shadow: inset 10px 0 18px -10px rgba(0,0,0,.6), 0 0 0 1px rgba(201,133,74,.32), 0 30px 70px rgba(0,0,0,.5);
  }
  .page::before, .page::after { content: ""; position: absolute; width: 18px; height: 18px; border: 1px solid rgba(226,176,122,.45); pointer-events: none; }
  .page::before { top: 10px; left: 14px; border-right: 0; border-bottom: 0; }
  .page::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
  .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--bronze-2); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
  .seal { width: 18px; height: 18px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--bronze-2), var(--bronze) 60%, #6e4424); box-shadow: 0 0 12px var(--glow); }
  .page.writing .seal { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 22px 4px var(--glow); transform: scale(1.1); } }
  .page h1 { margin: 12px 0 6px; font: 600 clamp(30px, 5vw, 46px)/1.08 var(--display); letter-spacing: .02em; text-wrap: balance; overflow-wrap: break-word; }
  .sub { margin: 0; color: var(--bronze-2); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
  .lead { margin: 20px 0 0; font-size: 23px; line-height: 1.5; text-wrap: pretty; }
  .flow { margin-top: 6px; }
  .flow::after { content: ""; display: block; clear: both; }
  .flow h2 { margin: 26px 0 6px; font: 600 19px var(--display); letter-spacing: .04em; color: var(--bronze-2); }
  .flow p { margin: 10px 0 0; line-height: 1.62; text-wrap: pretty; overflow-wrap: break-word; }
  .flow h2.ask { font: italic 400 20px var(--serif); letter-spacing: 0; color: var(--muted); padding-left: 12px; border-left: 2px solid var(--bronze); margin-top: 34px; }
  .facts {
    float: right; width: min(290px, 100%); margin: 20px 0 14px 26px; padding: 14px 16px; border-radius: 6px;
    background: linear-gradient(180deg, var(--lapis-2), var(--lapis));
    box-shadow: 0 0 0 1px rgba(226,176,122,.32), 0 0 26px rgba(201,133,74,.14);
    animation: rise-in .5s ease both;
  }
  .facts h3 { margin: 0 0 8px; font: 500 11px var(--serif); letter-spacing: .2em; text-transform: uppercase; color: var(--bronze-2); }
  .facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .steps { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; line-height: 1.55; animation: rise-in .45s ease both; }
  .steps li::before {
    content: counter(s); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(201,133,74,.16); box-shadow: inset 0 0 0 1px rgba(201,133,74,.45); color: var(--bronze-2); font: 600 14px var(--display);
  }
  .table-wrap { margin-top: 16px; overflow-x: auto; animation: rise-in .45s ease both; }
  .table-wrap table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .table-wrap th { text-align: left; font: 600 13px var(--display); letter-spacing: .06em; color: var(--bronze-2); padding: 8px 12px; border-bottom: 1px solid rgba(201,133,74,.45); }
  .table-wrap td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .portal {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; margin-top: 20px; padding: 14px 16px;
    border-radius: 6px; background: rgba(201,133,74,.12); box-shadow: inset 0 0 0 1px rgba(226,176,122,.45), 0 0 30px rgba(201,133,74,.16);
    color: var(--ink); text-decoration: none; animation: rise-in .5s ease both;
  }
  .portal:hover { background: rgba(201,133,74,.2); }
  .portal .fav { width: 52px; height: 52px; font-size: 22px; }
  .portal strong { display: block; font: 600 20px var(--display); }
  .portal small { color: var(--muted); font-size: 14px; }
  .portal .open { padding: 9px 16px; border-radius: 999px; background: var(--bronze); color: var(--on-bronze); font-size: 15px; }
  .tablet-seal {
    display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 14px; border-radius: 4px; width: 100%;
    background: rgba(197,210,178,.07); box-shadow: inset 0 0 0 1px rgba(197,210,178,.3); border: 0; text-align: left; cursor: pointer; color: var(--ink);
  }
  .tablet-seal .glyph { font-size: 18px; }
  .tablet-seal small { display: block; color: var(--good); font: 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .scribing { margin: 12px 0 0; line-height: 1.6; min-height: 1.6em; }
  .glyph { font-family: var(--cun); font-size: .82em; color: var(--bronze-2); text-shadow: 0 0 10px var(--glow); letter-spacing: .04em; }
  .glyph.dim { opacity: .5; }
  .colophon { clear: both; margin: 30px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 14px; font-style: italic; }
  .notice { margin: 18px 0 0; padding: 14px 16px; border-radius: 4px; background: rgba(224,192,120,.08); box-shadow: inset 0 0 0 1px rgba(224,192,120,.32); line-height: 1.5; }

  /* Side: doorways and related books */
  .side { display: grid; gap: 22px; min-width: 0; }
  .panel h2 { margin: 0 0 10px; font: 500 12px var(--serif); letter-spacing: .22em; text-transform: uppercase; color: var(--bronze-2); }
  .doors { display: grid; gap: 8px; }
  .door {
    display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 6px;
    background: rgba(29,23,18,.82); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); text-decoration: none;
    animation: rise-in .45s ease both; min-width: 0;
  }
  .door:hover { box-shadow: inset 0 0 0 1px var(--bronze); }
  .door strong { display: block; font-weight: 500; font-size: 16px; }
  .door small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .door .host { color: var(--faint); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(201,133,74,.16); box-shadow: inset 0 0 0 1px rgba(201,133,74,.4); color: var(--bronze-2); font: 600 14px var(--display); }
  .elsewhere { display: flex; flex-wrap: wrap; gap: 8px; }
  .elsewhere a { padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(201,133,74,.3); color: var(--muted); text-decoration: none; font-size: 15px; background: rgba(20,16,13,.6); }
  .elsewhere a:hover { color: var(--bronze-2); border-color: var(--bronze-2); }
  .related { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .related .book-btn { min-height: 118px; padding: 10px 10px 10px 16px; }
  .related .book-btn strong { font-size: 14px; }

  /* Ask bar */
  .askbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(0deg, rgba(15,13,11,.98) 65%, rgba(15,13,11,0));
  }
  .askbar form { max-width: 1180px; margin: 0 auto; }
  .askbar .field { max-width: 760px; background: linear-gradient(180deg, var(--lapis-2), var(--lapis)); box-shadow: 0 0 0 1px rgba(226,176,122,.4), 0 0 30px rgba(201,133,74,.18); }
  .askbar .field input { font-size: 18px; }
  .askbar .go:disabled { opacity: .6; cursor: progress; }

  /* Tablet record */
  .record { position: fixed; inset: 0; z-index: 6; display: grid; place-items: start center; overflow-y: auto; padding: 40px 16px; background: rgba(10,8,7,.74); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .record .page { width: min(720px, 100%); animation: rise-in .4s ease both; }
  .close { position: absolute; top: 12px; right: 14px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); font-size: 24px; cursor: pointer; }
  .claims { margin: 0; padding: 0; list-style: none; }
  .claims li { border-top: 1px solid #3a2e24; padding: 12px 0; }
  .claims p { margin: 0 0 6px; }
  .src { display: block; font-size: 14px; color: var(--link); overflow-wrap: anywhere; }
  .when { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }

  @media (max-width: 640px) {
    body { font-size: 17px; }
    .page { padding: 24px 20px 28px; }
    .lead { font-size: 20px; }
    .facts { float: none; width: 100%; margin: 18px 0 6px; }
    .mini { font-size: 20px; }
    .top-row { gap: 12px; }
    .books { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .book-btn { min-height: 128px; }
    .portal { grid-template-columns: 44px 1fr; }
    .portal .fav { width: 44px; height: 44px; }
    .portal .open { grid-column: 1 / -1; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .mote { display: none; }
    .cover { display: none; }
  }
</style>

<div class="library" id="library" aria-hidden="true"></div>
<div class="app">
  <section class="home" id="home">
    <div class="home-inner">
      <img class="seal-img" src="__IMG__" alt="Nabu, the scribe" width="88" height="88">
      <h1 class="wordmark">NABU</h1>
      <p class="tagline">Ask for any book in the world. It comes to you and writes itself.</p>
      <form id="home-form">
        <label class="field" for="home-q">
          <input id="home-q" type="search" placeholder="Search anything, or ask a question" autocomplete="off" aria-label="Search">
          <button class="go" type="submit" aria-label="Summon">
            <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M1 15 L7 1 L13 15 Z" fill="currentColor"/></svg>
          </button>

      </form>
      <div class="chips" id="chips">
        <button class="chip" type="button">Rimuru's Great Sage</button>
        <button class="chip" type="button">How grimoires work in Black Clover</button>
        <button class="chip" type="button">How to start a YouTube channel</button>
        <button class="chip" type="button">Cloudflare Workers AI vs OpenAI API</button>

      <div class="books" id="books"></div>
    </div>
  </section>

  <section id="results" hidden>
    <header class="top">
      <div class="top-row">
        <button class="mini" id="mini" type="button" aria-label="Back to your library">NABU</button>
        <form id="top-form">
          <label class="field" for="top-q">
            <input id="top-q" type="search" autocomplete="off" aria-label="Search">
            <button class="go" type="submit" aria-label="Summon">
              <svg width="12" height="14" viewBox="0 0 14 16" aria-hidden="true"><path d="M1 15 L7 1 L13 15 Z" fill="currentColor"/></svg>
            </button>
          </label>
        </form>
      </div>
    </header>
    <div class="board">
      <div class="summon" id="summon">
        <div class="cover" aria-hidden="true"><span id="cover-glyph">𒀭</span></div>
        <article class="page" id="page" aria-live="polite">
          <div class="eyebrow"><span class="seal"></span><span id="eyebrow">The Sage is writing</span></div>
          <h1 id="title"></h1>
          <p class="sub" id="sub"></p>
          <div id="above"></div>

    h.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
    var turns = current.turns.concat([{ role: "user", content: "Follow-up from the same person: «" + q + "»\nAnswer it on this page using the same tags. Start with a @lead that answers it directly, then add @p, @step, @fact, @row, or @h lines only if they help. Add up to two @site lines if a page would help, and up to two @next lines. Lines with tags only." }]);
    var fr = new Renderer(section, false, tk, false);
    stream(turns, fr, function (text, err) {
      btn.disabled = false; page.classList.remove("writing"); $("eyebrow").textContent = "Written by the Sage";
      if (err && !text) { section.appendChild(el("p", null, "The Sage could not answer that just now.")); return; }
      current.turns = turns.concat([{ role: "assistant", content: text }]);
      current.follow = (current.follow || []).concat([{ q: q, text: text }]);
      shelf = [current].concat(shelf.filter(function (s) { return s !== current; })); save();
    }, section);
  });

  $("home-form").addEventListener("submit", function (ev) { ev.preventDefault(); go($("home-q").value); });
  $("top-form").addEventListener("submit", function (ev) { ev.preventDefault(); go(topQ.value); });
  $("chips").addEventListener("click", function (ev) { if (ev.target.classList.contains("chip")) go(ev.target.textContent); });
  $("mini").addEventListener("click", function () {
    token++; if (ctl) ctl.abort();
    results.hidden = true; home.hidden = false; document.body.classList.remove("reading");
    renderShelf(); $("home-q").value = ""; window.scrollTo(0, 0);
  });

  renderShelf();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}} — Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2314100d' width='32' height='32'/%3E%3Cpath d='M7 26 L15 6 L19 26 Z' fill='%23c9854a'/%3E%3Cpath d='M18 26 L24 12 L28 26 Z' fill='%23e2b07a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 28px 80px; }
  header.nav { margin-bottom: 22px; }
  .spoken { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; font-size: 18px; }
  .spoken img {
    width: 40px; height: 52px; object-fit: cover; object-position: center 12%;
    flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(201, 133, 74, .5);
  }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 36px; align-items: start; }
  h1 {
    font-size: clamp(36px, 6vw, 60px); font-weight: 500;
    letter-spacing: -0.03em; line-height: 1; margin: 8px 0 16px;
    overflow-wrap: break-word;
  }
  .summary { font-size: 21px; line-height: 1.45; color: var(--muted); margin: 0 0 8px; }
  .rule { height: 1px; margin: 22px 0; background: linear-gradient(90deg, var(--bronze), transparent 75%); }
  .body { font-size: 18px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: break-word; }
  h2 { font-weight: 500; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--bronze-2); margin: 36px 0 8px; }
  ol, ul { margin: 0; padding: 0; list-style: none; }
  li { border-top: 1px solid #3a2e24; padding: 14px 0; }
  li p { margin: 0 0 6px; }
  .src, .archive { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .src.missing { color: var(--draft); }
  .when { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .revised { color: var(--muted); font-size: 13px; letter-spacing: .06em; margin-top: 28px; }
  .rail { position: sticky; top: 18px; }
  .related, a.related {
    display: block; padding: 10px 0; border-top: 1px solid #3a2e24;
    text-decoration: none; color: inherit;
  }
  a.related strong { display: block; font-weight: 500; }
  a.related:hover strong { color: var(--bronze-2); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 4px 0 8px; }
  .claim-group { margin: 18px 0 0; }
  .claim-group h3 {
    margin: 0 0 4px; font-size: 12px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--bronze-2);
  }
  .claim-group.unsourced h3 { color: var(--draft); }
  .local-hall {
    width: 100%; height: 180px; margin-top: 12px; border-radius: 3px;
    background: #0c0a08; box-shadow: 0 0 0 1px rgba(201,133,74,.35);
    cursor: grab; touch-action: none;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .rail { position: static; }
    .wrap { padding: 18px 16px calc(64px + env(safe-area-inset-bottom)); }
    .summary { font-size: 18px; }
    h1 { font-size: clamp(30px, 10vw, 44px); }
    .spoken { font-size: 16px; }
  }
  @media (max-width: 430px) {
    .wrap { padding: 14px 12px calc(56px + env(safe-area-inset-bottom)); }
    h1 { font-size: 28px; }
    .summary { font-size: 16px; }
    .body { font-size: 16px; }
    .tools { flex-direction: column; align-items: flex-start; gap: 4px; }
    .src, .archive, .body { overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="/">
        <svg class="mark" width="22" height="18" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M2 20 L10 2 L14 20 Z" fill="currentColor"/>
          <path d="M13 20 L19 7 L23 20 Z" fill="currentColor" opacity=".72"/>
        </svg>
        Nabu
      </a>
      <nav class="doors">
        <a href="/">Tablet</a>
        <a href="/archive">Archive</a>
        <a href="/propose">Propose</a>
        <a href="/ledger">Ledger</a>
      </nav>
    </header>
    <div class="inscribe" aria-hidden="true"></div>
    <p class="spoken"><img src="/static/scribe.jpg" alt="" width="40" height="52">{{VOICE}}</p>
    <div class="layout">
      <article>
        <p class="kind">{{KIND}}</p>
        <h1>{{TITLE}}</h1>
        <div class="tools">
          <span class="status {{STATUS}}">{{STATUS}}</span>
          {{REVISE}}
        </div>
        <p class="summary">{{SUMMARY}}</p>
        {{METER}}
        <div class="rule"></div>
        <div class="body">{{BODY}}</div>
        <h2>Claims</h2>
        {{CLAIMS}}
        <p class="revised">{{UPDATED}}</p>
      </article>
      <aside class="rail">
        <h2>Related</h2>
        {{RELATED}}
        <h2>Backlinks</h2>
        {{BACKLINKS}}
        <h2>Neighborhood</h2>
        <canvas class="local-hall" id="hall" width="560" height="360" aria-label="Local tablet neighborhood"></canvas>
        <h2>Earlier cuts</h2>
        <ol>{{REVISIONS}}</ol>
      </aside>
    </div>
  </div>
  <script type="application/json" id="graph-data">{{GRAPH}}</script>
  <script src="/static/hall.js"></script>
</body>
</html>

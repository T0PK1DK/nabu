<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Cpath d='M8 26 L16 6 L20 26 Z' fill='%23c9854a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
<style>
  body {
    background-image: radial-gradient(900px 420px at 12% -80px, rgba(201,133,74,.16), transparent 60%);
  }
  .room { min-height: 100vh; padding: 36px 20px 56px; }
  .slab {
    width: min(860px, 100%);
    margin: 0 auto;
    background:
      linear-gradient(180deg, rgba(243, 230, 212, .05), transparent 140px),
      var(--slab);
    border-radius: 4px;
    padding: 22px 28px 10px;
    box-shadow:
      0 0 0 1px rgba(201, 133, 74, .28),
      inset 0 1px 0 rgba(243, 230, 212, .1),
      0 28px 60px rgba(0, 0, 0, .45);
  }
  .presence { display: flex; gap: 18px; align-items: center; margin: 18px 0 22px; }
  .presence img {
    width: 86px; height: 114px; object-fit: cover; object-position: center 12%;
    flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(201, 133, 74, .5);
  }
  .voice { margin: 8px 0 0; min-height: 2.7em; font-size: 22px; line-height: 1.35; }
  label { display: block; margin: 0 0 4px; color: var(--muted); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  .field { display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid rgba(201, 133, 74, .55); }
  input[type="search"] {
    flex: 1; min-width: 0; background: transparent; color: var(--ink);
    border: 0; border-radius: 0; padding: 4px 0 12px; font: 32px/1.15 inherit; outline: none;
  }
  input[type="search"]::placeholder { color: rgba(168, 146, 120, .5); }
  input[type="search"]::-webkit-search-cancel-button { display: none; }
  button[type="submit"] {
    width: 48px; height: 48px; margin-bottom: 8px; flex: none;
    display: grid; place-items: center; background: var(--bronze); color: #1a120c;
    border: 0; border-radius: 2px; cursor: pointer;
  }
  button[type="submit"]:hover { background: var(--bronze-2); }
  button[type="submit"]:disabled { cursor: progress; opacity: .7; }
  .facets { display: grid; gap: 10px; margin: 14px 0 6px; }
  .facet-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .count { color: var(--muted); font-size: 12px; letter-spacing: .16em; }
  .registers { margin-top: 10px; transition: opacity .25s ease; }
  .slab.searching .registers { opacity: .22; }
  .slab.searching .presence img { animation: lamp 1.1s ease-in-out infinite; }
  @keyframes lamp {
    50% { box-shadow: 0 0 0 1px rgba(226, 176, 122, .95), 0 0 28px rgba(201, 133, 74, .55); }
  }
  .registers.fresh .hit { animation: inscribe .42s ease both; }
  .registers.fresh .hit:nth-child(2) { animation-delay: .05s; }
  .registers.fresh .hit:nth-child(3) { animation-delay: .1s; }
  .registers.fresh .hit:nth-child(4) { animation-delay: .15s; }
  @keyframes inscribe {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  a.hit {
    display: grid; grid-template-columns: 40px 1fr; gap: 8px 14px;
    padding: 16px 0 15px; border-top: 1px solid var(--line);
    text-decoration: none; color: inherit;
  }
  .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-size: 12px; letter-spacing: .04em;
    color: var(--bronze); padding-top: 6px;
  }
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px 16px; flex-wrap: wrap; }
  h2 { margin: 0; font-size: 23px; font-weight: 500; letter-spacing: -.02em; text-wrap: balance; }
  a.hit:hover h2 { color: var(--bronze-2); }
  .entry p, .entry .snip { margin: 6px 0 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .colophon { width: min(860px, 100%); margin: 16px auto 0; color: #6f5e4e; font-size: 14px; }
  @media (max-width: 640px) {
    .room { padding: 12px 12px calc(40px + env(safe-area-inset-bottom)); }
    .slab { padding: 16px 14px 8px; }
    .presence { gap: 12px; margin: 12px 0 16px; }
    .presence img { width: 60px; height: 80px; }
    .voice { font-size: 18px; min-height: 0; }
    input[type="search"] { font-size: 22px; }
    button[type="submit"] { width: 44px; height: 44px; }
    h2 { font-size: 19px; }
    .line { align-items: flex-start; }
    .entry p, .entry .snip { font-size: 15px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .chip { flex: none; }
  }
</style>
</head>
<body>
  <div class="room">
    <article class="slab" id="slab">
      <header class="nav">
        <a class="brand" href="/">
          <svg width="22" height="18" viewBox="0 0 28 22" aria-hidden="true">
            <path d="M2 20 L10 2 L14 20 Z" fill="#c9854a"/>
            <path d="M13 20 L19 7 L23 20 Z" fill="#e2b07a"/>
          </svg>
          Nabu
        </a>
        <nav class="doors">
          <a href="/" aria-current="page">Tablet</a>
          <a href="/archive">Archive</a>
          <a href="/propose">Propose</a>
          <a href="/ledger">Ledger</a>
        </nav>
      </header>
      <div class="presence">
        <img src="/static/scribe.jpg" alt="" width="86" height="114">
        <div>
          <p class="voice" id="voice" aria-live="polite">{{VOICE}}</p>
        </div>
      </div>
      <form id="ask" action="/" method="get">
        <label for="q">Ask him</label>
        <div class="field">
          <input id="q" type="search" name="q" value="{{QUERY}}" placeholder="Writing, fate, a god…" autofocus>
          <button type="submit" aria-label="Search">
            <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true">
              <path d="M1 15 L7 1 L13 15 Z" fill="#1a120c"/>
            </svg>
          </button>
        </div>
        <div class="facets">
          <input type="hidden" id="kind" name="kind" value="{{KIND}}">
          <input type="hidden" id="status" name="status" value="{{STATUS}}">
          <div class="facet-row" id="kind-chips" role="group" aria-label="Kind">{{KIND_CHIPS}}</div>
          <div class="facet-row" id="status-chips" role="group" aria-label="Status">{{STATUS_CHIPS}}</div>
          <span class="count" id="count">{{LABEL}} {{COUNT}}</span>
        </div>
      </form>
      <div class="registers" id="registers">
{{RESULTS}}
      </div>
    </article>
    <p class="colophon">He keeps the tablet. He does not invent the fate. {{LEDGER}}</p>
  </div>
<script src="/static/search.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Cpath d='M8 26 L16 6 L20 26 Z' fill='%23c9854a'/%3E%3C/svg%3E">
<style>
  :root {
    --room: #100e0c;
    --slab: #231b16;
    --ink: #f3e6d4;
    --muted: #a89278;
    --line: rgba(243, 230, 212, .1);
    --bronze: #c9854a;
    --bronze-2: #e2b07a;
    --draft: #e0c078;
    --disputed: #d4846a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--room); color: var(--ink); }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    min-height: 100vh;
  }
  .room { min-height: 100vh; padding: 36px 20px 56px; }
  .slab {
    width: min(860px, 100%);
    margin: 0 auto;
    background:
      linear-gradient(180deg, rgba(243, 230, 212, .05), transparent 140px),
      var(--slab);
    border-radius: 4px;
    padding: 22px 28px 10px;
    box-shadow:
      0 0 0 1px rgba(201, 133, 74, .28),
      inset 0 1px 0 rgba(243, 230, 212, .1),
      0 28px 60px rgba(0, 0, 0, .45);
  }
  .presence { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; }
  .presence img {
    width: 86px;
    height: 114px;
    object-fit: cover;
    object-position: center 12%;
    flex: none;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(201, 133, 74, .5);
  }
  .brand {
    color: var(--bronze-2);
    text-decoration: none;
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: 12px;
  }
  .voice {
    margin: 8px 0 0;
    min-height: 2.7em;
    font-size: 22px;
    line-height: 1.35;
    color: var(--ink);
  }
  label {
    display: block;
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .field {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    border-bottom: 1px solid rgba(201, 133, 74, .55);
  }
  input[type="search"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: var(--ink);
    border: 0;
    border-radius: 0;
    padding: 4px 0 12px;
    font: 32px/1.15 inherit;
    outline: none;
  }
  input[type="search"]::placeholder { color: rgba(168, 146, 120, .5); }
  input[type="search"]::-webkit-search-cancel-button { display: none; }
  button {
    width: 48px;
    height: 48px;
    margin-bottom: 8px;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--bronze);
    color: #1a120c;
    border: 0;
    border-radius: 2px;
    cursor: pointer;
  }
  button:hover { background: var(--bronze-2); }
  button:disabled { cursor: progress; opacity: .7; }
  button svg { margin-left: 1px; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--bronze-2);
    outline-offset: 3px;
  }
  .registers { margin-top: 10px; transition: opacity .25s ease; }
  .slab.searching .registers { opacity: .22; }
  .slab.searching .presence img { animation: lamp 1.1s ease-in-out infinite; }
  @keyframes lamp {
    50% { box-shadow: 0 0 0 1px rgba(226, 176, 122, .95), 0 0 28px rgba(201, 133, 74, .55); }
  }
  .registers.fresh .hit { animation: inscribe .42s ease both; }
  .registers.fresh .hit:nth-child(2) { animation-delay: .05s; }
  .registers.fresh .hit:nth-child(3) { animation-delay: .1s; }
  .registers.fresh .hit:nth-child(4) { animation-delay: .15s; }
  .registers.fresh .hit:nth-child(5) { animation-delay: .2s; }
  .registers.fresh .hit:nth-child(6) { animation-delay: .25s; }
  @keyframes inscribe {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  a.hit {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 8px 14px;
    align-items: start;
    padding: 16px 0 15px;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--bronze);
    padding-top: 6px;
  }
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  h2 { margin: 0; font-size: 23px; font-weight: 500; letter-spacing: -.02em; text-wrap: balance; }
  a.hit:hover h2 { color: var(--bronze-2); }
  .kind {
    display: block;
    margin-top: 3px;
    color: var(--bronze-2);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .entry p { margin: 6px 0 0; color: var(--muted); font-size: 16px; line-height: 1.45; text-wrap: pretty; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #8d7b68;
  }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.draft { color: var(--draft); }
  .status.disputed { color: var(--disputed); }
  .empty { margin: 22px 0 18px; color: var(--muted); font-size: 18px; }
  .colophon {
    width: min(860px, 100%);
    margin: 16px auto 0;
    color: #6f5e4e;
    font-size: 14px;
  }
  @media (max-width: 640px) {
    .room { padding: 14px 12px 40px; }
    .slab { padding: 16px 14px 8px; }
    .presence { gap: 12px; }
    .presence img { width: 68px; height: 90px; }
    .voice { font-size: 18px; }
    input[type="search"] { font-size: 24px; }
    h2 { font-size: 20px; }
    .line { align-items: flex-start; }
    .entry p { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .registers, .presence img, .registers.fresh .hit { animation: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="room">
    <article class="slab" id="slab">
      <div class="presence">
        <img src="/static/scribe.jpg" alt="Nabu, the scribe" width="86" height="114">
        <div>
          <a class="brand" href="/">Nabu</a>
          <p class="voice" id="voice" aria-live="polite">{{VOICE}}</p>
        </div>
      </div>
      <form id="ask" action="/" method="get">
        <label for="q">Ask him</label>
        <div class="field">
          <input id="q" type="search" name="q" value="{{QUERY}}" placeholder="Writing, fate, a god…" autofocus>
          <button type="submit" aria-label="Search">
            <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true">
              <path d="M1 15 L7 1 L13 15 Z" fill="#1a120c"/>
            </svg>
          </button>
        </div>
      </form>
      <div class="registers" id="registers">
{{RESULTS}}
      </div>
    </article>
    <p class="colophon">He keeps the tablet. He does not invent the fate.</p>
  </div>
<script>
(function () {
  var form = document.getElementById("ask");
  var input = document.getElementById("q");
  var voice = document.getElementById("voice");
  var registers = document.getElementById("registers");
  var slab = document.getElementById("slab");
  var button = form.querySelector("button");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var seeking = ["I lift the stylus.", "I search the clay.", "I read only what is written."];
  var timer = 0;

  function answer(n) {
    var words = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve"];
    if (!n) return "I turned the tablet. That is not written.";
    if (n === 1) return "One line was already there.";
    return (words[n] || String(n)) + " lines were already written.";
  }

  function hit(h, i) {
    var a = document.createElement("a");
    a.className = "hit";
    a.href = "/e/" + encodeURIComponent(h.slug);
    var num = document.createElement("span");
    num.className = "num";
    num.textContent = String(i + 1).padStart(2, "0");
    var entry = document.createElement("span");
    entry.className = "entry";
    var line = document.createElement("span");
    line.className = "line";
    var title = document.createElement("h2");
    title.textContent = h.title;
    var status = document.createElement("span");
    status.className = "status " + (h.status || "");
    var dot = document.createElement("i");
    status.appendChild(dot);
    status.appendChild(document.createTextNode(h.status || ""));
    line.appendChild(title);
    line.appendChild(status);
    var kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = h.kind || "";
    var summary = document.createElement("p");
    summary.textContent = h.summary || "";
    entry.appendChild(line);
    entry.appendChild(kind);
    entry.appendChild(summary);
    a.appendChild(num);
    a.appendChild(entry);
    return a;
  }

  function paint(q, hits, fresh) {
    registers.replaceChildren();
    if (!hits.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nothing on the tablet for that.";
      registers.appendChild(empty);
    } else {
      hits.forEach(function (h, i) { registers.appendChild(hit(h, i)); });
    }
    registers.classList.toggle("fresh", !!(fresh && !reduced));
    voice.textContent = q ? answer(hits.length) : "The tablet is open. Ask, and I will find the line.";
  }

  function ask(q, ritual) {
    if (timer) clearInterval(timer);
    button.disabled = true;
    slab.classList.add("searching");
    var step = 0;
    if (ritual && !reduced) {
      voice.textContent = seeking[0];
      timer = setInterval(function () {
        step = (step + 1) % seeking.length;
        voice.textContent = seeking[step];
      }, 380);
    }
    var started = performance.now();
    return fetch("/api/search?q=" + encodeURIComponent(q))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var wait = ritual && !reduced ? Math.max(0, 1100 - (performance.now() - started)) : 0;
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(data); }, wait);
        });
      })
      .then(function (data) {
        clearInterval(timer);
        timer = 0;
        button.disabled = false;
        slab.classList.remove("searching");
        paint(q, data.hits || [], ritual);
      })
      .catch(function () {
        location.href = q ? "/?q=" + encodeURIComponent(q) : "/";
      });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var q = input.value.trim();
    history.pushState({ q: q }, "", q ? "/?q=" + encodeURIComponent(q) : "/");
    ask(q, true);
  });

  window.addEventListener("popstate", function () {
    var q = new URLSearchParams(location.search).get("q") || "";
    input.value = q;
    ask(q, false);
  });
})();
</script>
</body>
</html>

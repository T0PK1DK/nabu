<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Cpath d='M8 26 L16 6 L20 26 Z' fill='%23c9854a'/%3E%3C/svg%3E">
<style>
  :root {
    --room: #100e0c;
    --slab: #231b16;
    --ink: #f3e6d4;
    --muted: #a89278;
    --line: rgba(243, 230, 212, .1);
    --bronze: #c9854a;
    --bronze-2: #e2b07a;
    --draft: #e0c078;
    --disputed: #d4846a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--room); color: var(--ink); }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    min-height: 100vh;
  }
  .room {
    min-height: 100vh;
    padding: 40px 20px 56px;
  }
  .slab {
    width: min(860px, 100%);
    margin: 0 auto;
    background:
      linear-gradient(180deg, rgba(243, 230, 212, .045), transparent 96px),
      var(--slab);
    border-radius: 4px;
    padding: 26px 32px 8px;
    box-shadow:
      0 0 0 1px rgba(201, 133, 74, .28),
      inset 0 1px 0 rgba(243, 230, 212, .1),
      0 28px 60px rgba(0, 0, 0, .4);
  }
  .mast {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 28px;
  }
  .brand {
    color: var(--ink);
    text-decoration: none;
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: 13px;
  }
  .meta {
    color: var(--bronze-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .count { color: var(--ink); margin-left: 8px; }
  label {
    display: block;
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .field {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    border-bottom: 1px solid rgba(201, 133, 74, .55);
  }
  input[type="search"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: var(--ink);
    border: 0;
    border-radius: 0;
    padding: 6px 0 12px;
    font: 34px/1.15 inherit;
    outline: none;
  }
  input[type="search"]::placeholder { color: rgba(168, 146, 120, .55); }
  input[type="search"]::-webkit-search-cancel-button { display: none; }
  button {
    width: 48px;
    height: 48px;
    margin-bottom: 8px;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--bronze);
    color: #1a120c;
    border: 0;
    border-radius: 2px;
    cursor: pointer;
  }
  button svg { margin-left: 1px; }
  button:hover { background: var(--bronze-2); }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--bronze-2);
    outline-offset: 3px;
  }
  .registers { margin-top: 8px; }
  a.hit {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 8px 14px;
    align-items: start;
    padding: 16px 0 15px;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--bronze);
    padding-top: 6px;
  }
  .line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  h2 {
    margin: 0;
    font-size: 23px;
    font-weight: 500;
    letter-spacing: -.02em;
    text-wrap: balance;
  }
  a.hit:hover h2 { color: var(--bronze-2); }
  .kind {
    display: block;
    margin-top: 3px;
    color: var(--bronze-2);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .entry p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.45;
    text-wrap: pretty;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #8d7b68;
  }
  .status i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .status.draft { color: var(--draft); }
  .status.disputed { color: var(--disputed); }
  .empty { margin: 22px 0 18px; color: var(--muted); font-size: 18px; }
  .colophon {
    width: min(860px, 100%);
    margin: 16px auto 0;
    color: #6f5e4e;
    font-size: 13px;
    line-height: 1.45;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--bronze);
    font-size: .92em;
  }
  @media (max-width: 640px) {
    .room { padding: 14px 12px 40px; }
    .slab { padding: 18px 16px 6px; }
    input[type="search"] { font-size: 26px; }
    h2 { font-size: 20px; }
    .line { align-items: flex-start; }
    .entry p { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    a.hit { transition: none; }
  }
</style>
</head>
<body>
  <div class="room">
    <article class="slab">
      <header class="mast">
        <a class="brand" href="/">Nabu</a>
        <div class="meta">{{LABEL}}<span class="count">{{COUNT}}</span></div>
      </header>
      <form action="/" method="get">
        <label for="q">Ask the tablet</label>
        <div class="field">
          <input id="q" type="search" name="q" value="{{QUERY}}" placeholder="Writing, fate, a god…" autofocus>
          <button type="submit" aria-label="Search">
            <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true">
              <path d="M1 15 L7 1 L13 15 Z" fill="#1a120c"/>
            </svg>
          </button>
        </div>
      </form>
      <div class="registers">
{{RESULTS}}
      </div>
    </article>
    <p class="colophon">The agent uses <code>GET /api/search</code>. A line with no source stays a draft.</p>
  </div>
</body>
</html>

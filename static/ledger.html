<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ledger — Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Cpath d='M8 26 L16 6 L20 26 Z' fill='%23c9854a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 22px 80px; }
  .spoken { font-size: 22px; margin: 22px 0; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
  .counts div {
    background: var(--slab); padding: 16px; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(201,133,74,.28);
  }
  .counts b { display: block; font-size: 28px; font-weight: 500; }
  .counts span { color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; }
  h2 { font-weight: 500; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--bronze-2); }
  ul { list-style: none; padding: 0; }
  li { border-top: 1px solid #3a2e24; padding: 8px 0; display: flex; justify-content: space-between; }
  @media (max-width: 640px) {
    .wrap { padding: 18px 16px calc(80px + env(safe-area-inset-bottom)); }
    .spoken { font-size: 18px; }
    .counts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="/">Nabu</a>
      <nav class="doors">
        <a href="/">Tablet</a>
        <a href="/archive">Archive</a>
        <a href="/propose">Propose</a>
        <a href="/ledger" aria-current="page">Ledger</a>
      </nav>
    </header>
    <p class="spoken">{{VOICE}}</p>
    <div class="counts">
      <div><b>{{ENTRIES}}</b><span>entries</span></div>
      <div><b>{{CLAIMS}}</b><span>sourced claims</span></div>
      <div><b>{{REVISIONS}}</b><span>earlier cuts</span></div>
    </div>
    <h2>Status</h2>
    <ul>{{STATUSES}}</ul>
    <h2>Kinds</h2>
    <ul>{{KINDS}}</ul>
    <h2>Source hosts</h2>
    <ul>{{HOSTS}}</ul>
  </div>
</body>
</html>

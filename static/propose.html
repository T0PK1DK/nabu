<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Propose — Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Cpath d='M8 26 L16 6 L20 26 Z' fill='%23c9854a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 22px 80px; }
  .spoken { font-size: 22px; margin: 22px 0; }
  form { display: grid; gap: 14px; }
  label { color: var(--muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  input, textarea, select {
    width: 100%; background: #1a1511; color: var(--ink);
    border: 1px solid rgba(201,133,74,.35); border-radius: 2px;
    padding: 10px 12px; font: 16px/1.4 inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .claim {
    border: 1px solid rgba(201,133,74,.28); padding: 12px; border-radius: 3px;
    display: grid; gap: 8px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    background: var(--bronze); color: #1a120c; border: 0; border-radius: 2px;
    padding: 10px 16px; font: 14px/1 inherit; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--bronze-2); box-shadow: 0 0 0 1px rgba(201,133,74,.4); }
  .reason { min-height: 3em; color: var(--muted); }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="/">Nabu</a>
      <nav class="doors">
        <a href="/">Tablet</a>
        <a href="/archive">Archive</a>
        <a href="/propose" aria-current="page">Propose</a>
        <a href="/ledger">Ledger</a>
      </nav>
    </header>
    <p class="spoken" id="voice">{{VOICE}}</p>
    <form id="propose">
      <div class="row">
        <div>
          <label for="slug">Slug</label>
          <input id="slug" name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="tablet-of-destinies">
        </div>
        <div>
          <label for="kind">Kind</label>
          <input id="kind" name="kind" value="note" placeholder="deity, tool, project">
        </div>
      </div>
      <div>
        <label for="title">Title</label>
        <input id="title" name="title" required>
      </div>
      <div>
        <label for="summary">Summary</label>
        <textarea id="summary" name="summary" required></textarea>
      </div>
      <div>
        <label for="body">Body — use [[slug]] to point at another tablet</label>
        <textarea id="body" name="body" required></textarea>
      </div>
      <div>
        <label for="status">Requested status</label>
        <select id="status" name="status">
          <option value="verified">verified</option>
          <option value="draft">draft</option>
          <option value="disputed">disputed</option>
        </select>
      </div>
      <div id="claims"></div>
      <div class="actions">
        <button type="button" class="ghost" id="add-claim">Add claim</button>
        <button type="button" class="ghost" id="judge">Judge without saving</button>
        <button type="submit">Cut into the tablet</button>
      </div>
      <p class="reason" id="reason" aria-live="polite"></p>
    </form>
  </div>
  <script>window.NABU_TODAY = "{{TODAY}}";</script>
  <script src="/static/propose.js"></script>
</body>
</html>

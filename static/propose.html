<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Propose — Nabu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100e0c' width='32' height='32'/%3E%3Cpath d='M8 26 L16 6 L20 26 Z' fill='%23c9854a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .wrap { padding-bottom: 80px; }
  .spoken { font-size: 22px; margin: 22px 0 12px; }
  .banner {
    margin: 0 0 18px; padding: 10px 12px;
    border: 1px solid rgba(201,133,74,.35); border-radius: 3px;
    color: var(--muted); font-size: 15px;
  }
  .live-meter {
    position: sticky; top: 0; z-index: 2;
    padding: 10px 0 12px; background: linear-gradient(180deg, var(--room) 70%, transparent);
  }
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  input, textarea, select {
    width: 100%; background: #1a1511; color: var(--ink);
    border: 1px solid rgba(201,133,74,.35); border-radius: 2px;
    padding: 10px 12px; font: 16px/1.4 inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  textarea[name="summary"] { min-height: 90px; }
  textarea[name="text"] { min-height: 88px; }
  .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
  .slug-load { min-height: 44px; }
  input[readonly] { color: var(--muted); cursor: default; }
  .slug-note { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0; text-transform: none; }
  .claim {
    border: 1px solid rgba(201,133,74,.28); padding: 12px; border-radius: 3px;
    display: grid; gap: 8px;
  }
  .claim-head { display: flex; justify-content: space-between; align-items: center; color: var(--bronze-2); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    background: var(--bronze); color: #1a120c; border: 0; border-radius: 2px;
    padding: 10px 16px; min-height: 44px; font: 14px/1 inherit; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--bronze-2); box-shadow: 0 0 0 1px rgba(201,133,74,.4); }
  .reason { min-height: 3em; color: var(--muted); }
  @media (max-width: 640px) {
    .spoken { font-size: 18px; }
    .row { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
  }
  @media (max-width: 430px) {
    .spoken { font-size: 16px; }
    .live-meter {
      top: env(safe-area-inset-top);
      margin: 0 -12px;
      padding: 10px 12px 12px;
    }
    .actions {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 0 -12px -12px;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, var(--room) 70%, transparent);
    }
  }
</style>
</head>
<body>
  <div class="wrap page">
    <header class="nav">
      <a class="brand" href="/">
        <svg class="mark" width="22" height="18" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M2 20 L10 2 L14 20 Z" fill="currentColor"/>
          <path d="M13 20 L19 7 L23 20 Z" fill="currentColor" opacity=".72"/>
        </svg>
        Nabu
      </a>
      <nav class="doors">
        <a href="/">Tablet</a>
        <a href="/archive">Archive</a>
        <a href="/propose" aria-current="page">Propose</a>
        <a href="/ledger">Ledger</a>
      </nav>
    </header>
    <div class="inscribe" aria-hidden="true"></div>
    <p class="spoken" id="voice">{{VOICE}}</p>
    {{BANNER}}
    <div class="live-meter" id="meter-wrap">{{METER}}</div>
    <form id="propose">
      <div class="row">
        <label for="slug">Slug
          <input id="slug" name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="tablet-of-destinies" value="{{SLUG}}" data-original="{{ORIGINAL_SLUG}}" {{SLUG_ATTRS}} autocomplete="off">
        </label>
        <label for="kind">Kind
          <input id="kind" name="kind" value="{{KIND}}" placeholder="deity, tool, project">
        </label>
        <button type="button" class="ghost slug-load" id="load-slug">Load tablet</button>
      </div>
      <p class="slug-note" id="slug-note" aria-live="polite">{{SLUG_NOTE}}</p>
      <label for="title">Title
        <input id="title" name="title" required value="{{TITLE}}">
      </label>
      <label for="summary">Summary
        <textarea id="summary" name="summary" required>{{SUMMARY}}</textarea>
      </label>
      <label for="body">Body — use [[slug]] to point at another tablet
        <textarea id="body" name="body" required>{{BODY}}</textarea>
      </label>
      <label for="status">Requested status
        <select id="status" name="status">{{STATUS_OPTIONS}}</select>
      </label>
      <div id="claims">{{CLAIMS}}</div>
      <div class="actions">
        <button type="button" class="ghost" id="add-claim">Add claim</button>
        <button type="button" class="ghost" id="judge">Judge without saving</button>
        <button type="submit" id="cut">{{SUBMIT}}</button>
        <button type="button" class="ghost" id="cut-new" {{CUT_NEW_HIDDEN}}>Cut as a new tablet</button>
      </div>
      <p class="reason" id="reason" aria-live="polite"></p>
    </form>
  </div>
  <script>window.NABU_TODAY = "{{TODAY}}"; window.NABU_PREFILLED = {{PREFILLED}};</script>
  <script src="/static/propose.js"></script>
</body>
</html>
